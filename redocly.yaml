seo:
  title: Redocly
  description: Turn your OpenAPI description into reference docs, an MCP server, SDKs and tests, kept current on every pull request. Unlimited seats on every plan.
  siteUrl: https://redocly.com
  image: ./images/redocly-card.png
  lang: en-US

