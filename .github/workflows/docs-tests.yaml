name: Documentation tests
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v15
        with:
          config: .markdownlint.yaml
          globs: |
            docs/**/*.md
            !docs/platform/_partials/**
            !docs-legacy/developer-portal/**
            !docs/platform/spot/**
            !docs/platform/spot-exp/**
            !docs/platform/scout/**
            !docs/platform/blue-harvest/**
            !docs/platform/node_modules/**
            !docs/platform/reference/format-image-tag.md
            !docs/platform/extend/**
            !docs/platform/portal-changelog.md
            !docs/platform/.templates/*
            !docs/platform/customization/add-color-mode.md
            !docs/platform/customization/eject-components/eject-components-tutorial/index.md
            !docs/platform/customization/mcp-server/index.md
