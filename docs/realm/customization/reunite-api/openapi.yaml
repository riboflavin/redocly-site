tags:
  - name: Audit log exports
    description: Export organization audit logs for compliance, analysis, or archival.
  - name: Feedback
    description: Operations related to feedback.
  - name: Pushes
    description: Operations related to pushes.
paths:
  /orgs/{orgId}/audit-log-export-jobs:
    post:
      tags:
        - Audit log exports
      security:
        - ApiKey: []
      operationId: createAuditLogExportJob
      summary: Start an audit log export job
      description: |-
        {% configOptionRequirements plans=["Enterprise+"] /%}

        Creates an asynchronous audit log export job.
        Poll the job status endpoint until `status` is `COMPLETED`, then download from the export results endpoint.
      x-rateLimit:
        events: 60
        window: 1m
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - name: filter
          in: query
          required: false
          description: |-
            Standard list `filter` query. Supported fields for audit exports:
            - `type` — Event type.
              When omitted, exports include events of all types.
              Values must be valid audit log event types.
              Unsupported values return `400`.

            Filter fields other than `type` are ignored.
          schema:
            type: string
          example: type:com.redocly.apiKey.created
        - name: start
          in: query
          description: Start of the time range in YYYY-MM-DD format. When `end` is omitted, exports include events from `start` through `start + 31 days`.
          required: false
          example: '2026-01-01'
          schema:
            type: string
            format: date
        - name: end
          in: query
          description: End of the time range in YYYY-MM-DD format. When `start` is omitted, exports include events from `end - 31 days` through `end`. The time window between `start` and `end` must not exceed 31 days.
          required: false
          example: '2026-01-31'
          schema:
            type: string
            format: date
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum:
              - json
              - csv
            default: json
          description: Output file format for the generated download.
          example: json
        - name: x-redocly-client
          in: header
          required: false
          description: |
            Identifies the calling client as `<name>/<version>`, for example `reunite-ui/0.92.1`.
            Used for API consumer observability.
            Requests without it are attributed as `unknown`.
          schema:
            type: string
            pattern: ^[a-z0-9-]{1,64}/[\w.+-]{1,32}$
          example: reunite-ui/0.92.1
      responses:
        '201':
          description: Export job created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogExportJobCreated'
              example:
                id: exp_01hh1t9sa6gwfv5naz04gr7ehm
                createdAt: '2024-01-15T12:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orgs/{orgId}/audit-log-export-jobs/{exportJobId}:
    get:
      tags:
        - Audit log exports
      security:
        - ApiKey: []
      operationId: getAuditLogExportJob
      summary: Retrieve an audit log export job
      description: |-
        {% configOptionRequirements plans=["Enterprise+"] /%}

        Retrieve the status of an audit log export job.
        Poll this endpoint until `status` is `COMPLETED`, then download the file from the export results endpoint.
      x-rateLimit:
        events: 300
        window: 1m
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ExportJobId'
        - name: x-redocly-client
          in: header
          required: false
          description: |
            Identifies the calling client as `<name>/<version>`, for example `reunite-ui/0.92.1`.
            Used for API consumer observability.
            Requests without it are attributed as `unknown`.
          schema:
            type: string
            pattern: ^[a-z0-9-]{1,64}/[\w.+-]{1,32}$
          example: reunite-ui/0.92.1
      responses:
        '200':
          description: Export job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogExportJob'
              example:
                id: exp_01hh1t9sa6gwfv5naz04gr7ehm
                status: COMPLETED
                createdAt: '2024-01-15T12:00:00.000Z'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orgs/{orgId}/audit-log-export-results/{exportJobId}:
    get:
      tags:
        - Audit log exports
      security:
        - ApiKey: []
      operationId: getAuditLogExportResult
      summary: Retrieve an audit log export file
      description: |-
        {% configOptionRequirements plans=["Enterprise+"] /%}

        Download the file generated by an audit log export job.
        The file is available only after the export job completes.
        While the job status is `IN_PROGRESS` or `FAILED`, this endpoint returns `404`.
      x-rateLimit:
        events: 60
        window: 1m
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ExportJobId'
        - name: x-redocly-client
          in: header
          required: false
          description: |
            Identifies the calling client as `<name>/<version>`, for example `reunite-ui/0.92.1`.
            Used for API consumer observability.
            Requests without it are attributed as `unknown`.
          schema:
            type: string
            pattern: ^[a-z0-9-]{1,64}/[\w.+-]{1,32}$
          example: reunite-ui/0.92.1
      responses:
        '200':
          description: Export file. Media type matches the `format` from the create-job request.
          headers:
            Content-Disposition:
              description: 'Attachment hint for browsers and HTTP clients. Suggested filename: `{exportJobId}.json` or `{exportJobId}.csv`.'
              schema:
                type: string
              example: attachment; filename="exp_01hh1t9sa6gwfv5naz04gr7ehm.json"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogExportEvent'
              example:
                - id: evt_2fxb8r4kq7m3ndp9z6ja501
                  object: event
                  type: com.redocly.pullRequest.created
                  time: '2026-03-31T15:27:30.815Z'
                  subject: pr_7wnk3jm9xp2d4rv8qh5a01
                  actor:
                    id: usr_01h2r5f6qy8kr42p8yfw52spq6
                    object: user
                    uri: https://app.cloud.redocly.com/api/users/usr_01h2r5f6qy8kr42p8yfw52spq6
                  clientIp: 198.51.100.42
                  projectId: prj_01hh1t9sa6gwfv5naz04gr7ehm
                  projectSlug: my-project
            text/csv:
              schema:
                type: string
                format: binary
              example: |
                id,object,type,time,subject,actor,clientIp,projectId,projectSlug
                evt_2fxb8r4kq7m3ndp9z6ja501,event,com.redocly.pullRequest.created,2026-03-31T15:27:30.815Z,pr_7wnk3jm9xp2d4rv8qh5a01,"{""id"":""usr_01h2r5f6qy8kr42p8yfw52spq6"",""object"":""user"",""uri"":""https://app.cloud.redocly.com/api/users/usr_01h2r5f6qy8kr42p8yfw52spq6""}",198.51.100.42,prj_01hh1t9sa6gwfv5naz04gr7ehm,my-project
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orgs/{orgId}/projects/{projectId}/feedback:
    get:
      tags:
        - Feedback
      summary: List all feedback
      description: |-
        List all feedback.

        Requires `project.feedback.read` permission.
      x-rateLimit:
        events: 300
        window: 1m
      operationId: listFeedback
      security:
        - ApiKey: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
          description: |-
            Feedback list can be sorted by the following properties:
              - `id`
              - `createdAt`
              - `path`
              - `email`
              - `score`
              - `agent`
              - `targetFeature`

            To sort in descending order, prefix the field with `-` (for example `-createdAt`).
            To sort in ascending order, use the field name without a prefix (for example `createdAt`).

            By default, feedback list is sorted by `id` in descending order, which corresponds to the newest feedback first.
        - $ref: '#/components/parameters/Filter'
          description: |-
            Filter feedback by:
              - `createdAt`
              - `email`
              - `path`
              - `location`
              - `comment`
              - `internalComment`
              - `agent`
              - `targetFeature`
              - `status` (one of `NEW`, `IN_REVIEW`, `RESOLVED`, `ARCHIVED`, `SPAM`)
              - `feedbackComponent` (one of `SENTIMENT`, `RATING`, `COMMENT`, `MOOD`, `PROBLEM`, `SCALE`)
              - `origin` (one of `FORM`, `API`, `MCP`)

            This field requires a special format.

            For more information, see [Filter results](#section/filter-results).
        - $ref: '#/components/parameters/Search'
          description: |-
            Search feedback by query string.

            Feedback is searched by:
              - `email`
              - `path`
              - `location`
              - `comment`
              - `internalComment`
              - `agent`
              - `targetFeature`
        - name: x-redocly-client
          in: header
          required: false
          description: |
            Identifies the calling client as `<name>/<version>`, for example `reunite-ui/0.92.1`.
            Used for API consumer observability.
            Requests without it are attributed as `unknown`.
          schema:
            type: string
            pattern: ^[a-z0-9-]{1,64}/[\w.+-]{1,32}$
          example: reunite-ui/0.92.1
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackList'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orgs/{orgId}/projects/{projectId}/feedback/{feedbackId}:
    get:
      tags:
        - Feedback
      security:
        - ApiKey: []
      summary: Retrieve a feedback item
      description: |-
        Retrieve a feedback item.

        Requires `project.feedback.read` permission.
      x-rateLimit:
        events: 2000
        window: 1m
      operationId: getFeedback
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/FeedbackId'
        - name: x-redocly-client
          in: header
          required: false
          description: |
            Identifies the calling client as `<name>/<version>`, for example `reunite-ui/0.92.1`.
            Used for API consumer observability.
            Requests without it are attributed as `unknown`.
          schema:
            type: string
            pattern: ^[a-z0-9-]{1,64}/[\w.+-]{1,32}$
          example: reunite-ui/0.92.1
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Feedback
      security:
        - ApiKey: []
      summary: Partially update a feedback item
      description: |-
        Partially update a feedback item.

        Requires `project.feedback.update` permission.
      x-rateLimit:
        events: 300
        window: 1m
      operationId: updateFeedback
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/FeedbackId'
        - name: x-redocly-client
          in: header
          required: false
          description: |
            Identifies the calling client as `<name>/<version>`, for example `reunite-ui/0.92.1`.
            Used for API consumer observability.
            Requests without it are attributed as `unknown`.
          schema:
            type: string
            pattern: ^[a-z0-9-]{1,64}/[\w.+-]{1,32}$
          example: reunite-ui/0.92.1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchFeedbackRequest'
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Feedback
      security:
        - ApiKey: []
      summary: Delete a feedback item
      description: |-
        Delete a feedback item.

        Requires `project.feedback.delete` permission.
      x-rateLimit:
        events: 300
        window: 1m
      operationId: deleteFeedback
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/FeedbackId'
        - name: x-redocly-client
          in: header
          required: false
          description: |
            Identifies the calling client as `<name>/<version>`, for example `reunite-ui/0.92.1`.
            Used for API consumer observability.
            Requests without it are attributed as `unknown`.
          schema:
            type: string
            pattern: ^[a-z0-9-]{1,64}/[\w.+-]{1,32}$
          example: reunite-ui/0.92.1
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orgs/{orgId}/projects/{projectId}/feedback-export:
    get:
      tags:
        - Feedback
      summary: Export feedback report
      description: |-
        Download a feedback report as CSV or JSON file.
        Response Content-Type is `text/csv` when `format=csv` and `application/json` when `format=json`.

        Requires `project.feedback.read` permission.
      x-rateLimit:
        events: 10
        window: 1m
      operationId: exportFeedbackReport
      security:
        - ApiKey: []
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - name: format
          in: query
          required: false
          description: Export file format. Defaults to `csv`.
          schema:
            type: string
            enum:
              - csv
              - json
            default: csv
          example: csv
        - $ref: '#/components/parameters/After'
          description: |-
            Cursor from `page.nextPage` in a **List all feedback** response.
            The export includes only the rows after this cursor.
        - $ref: '#/components/parameters/Before'
          description: |-
            Cursor from `page.previousPage` in a **List all feedback** response.
            The export includes only the rows before this cursor.
        - name: limit
          description: |-
            Maximum number of feedback rows to include in the export (from the current sort order).

            When omitted, the export includes up to 1000 rows.
            Request a larger export explicitly, up to the maximum.
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1000
          example: 10000
        - $ref: '#/components/parameters/Sort'
          description: |-
            Feedback report can be sorted by the following properties:
              - `id`
              - `createdAt`
              - `path`
              - `email`
              - `score`
              - `agent`
              - `targetFeature`

            To sort in descending order, prefix the field with `-` (for example `-createdAt`).
            To sort in ascending order, use the field name without a prefix (for example `createdAt`).

            By default, feedback report is sorted by `id` in descending order, which corresponds to the newest feedback first.
        - $ref: '#/components/parameters/Filter'
          description: |-
            Filter feedback by:
              - `createdAt`
              - `email`
              - `path`
              - `location`
              - `comment`
              - `internalComment`
              - `agent`
              - `targetFeature`
              - `status` (one of `NEW`, `IN_REVIEW`, `RESOLVED`, `ARCHIVED`, `SPAM`)
              - `feedbackComponent` (one of `SENTIMENT`, `RATING`, `COMMENT`, `MOOD`, `PROBLEM`, `SCALE`)
              - `origin` (one of `FORM`, `API`, `MCP`)

            This field requires a special format.

            For more information, see [Filter results](#section/filter-results).
        - $ref: '#/components/parameters/Search'
          description: |-
            Search feedback by query string.

            Feedback is searched by:
              - `email`
              - `path`
              - `location`
              - `comment`
              - `internalComment`
              - `agent`
              - `targetFeature`
        - name: x-redocly-client
          in: header
          required: false
          description: |
            Identifies the calling client as `<name>/<version>`, for example `reunite-ui/0.92.1`.
            Used for API consumer observability.
            Requests without it are attributed as `unknown`.
          schema:
            type: string
            pattern: ^[a-z0-9-]{1,64}/[\w.+-]{1,32}$
          example: reunite-ui/0.92.1
      responses:
        '200':
          description: |-
            Export file.
            Media type depends on the `format` query parameter.

            The response is sent as a download: `Content-Disposition` is `attachment` with a generated filename unless the server chooses otherwise.

            Default filename pattern: `feedback_export_{orgId}_{projectId}_{timestamp}.{format}`, where `{timestamp}` is milliseconds since the Unix epoch and `{format}` is either `csv` or `json`.
          headers:
            Content-Disposition:
              description: |-
                Attachment hint for browsers and HTTP clients.
                Includes the suggested filename in the `filename` parameter (quoted).

                By default the filename follows `feedback_export_{orgId}_{projectId}_{timestamp}.{format}`, using the same `orgId` and `projectId` as in the path and a millisecond timestamp.
              schema:
                type: string
              example: attachment; filename="feedback_export_org_01hh1t9sa6gwfv5naz04gr7ehm_prj_01hh1t9sa6gwfv5naz04gr7ehm_1715432100123.csv"
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orgs/{orgId}/projects/{projectId}/pushes:
    post:
      operationId: push
      summary: Push files to remote
      x-rateLimit:
        events: 300
        window: 1m
      security:
        - ApiKey: []
      description: |-
        Push discovered files as a remote content.
        Files should be sent as a `multipart/form-data`.
        Commit details like commit message and author can be sent as a JSON object in the `commit` field.
        The complete multipart body must not exceed 500 MiB, including files, fields, and multipart overhead.

        Requires `project.remotes.update` permission.
        The CLI `push` command creates or updates the remote before it pushes files, so it also requires `project.remotes.create`.
      tags:
        - Pushes
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - name: x-redocly-client
          in: header
          required: false
          description: |
            Identifies the calling client as `<name>/<version>`, for example `reunite-ui/0.92.1`.
            Used for API consumer observability.
            Requests without it are attributed as `unknown`.
          schema:
            type: string
            pattern: ^[a-z0-9-]{1,64}/[\w.+-]{1,32}$
          example: reunite-ui/0.92.1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Push'
      responses:
        '201':
          description: Content pushed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Push'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '413':
          description: Push body exceeds 500 MiB.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
        - Pushes
      security:
        - ApiKey: []
      summary: List all pushes
      description: |-
        List all pushes.

        Requires `project.remotes.read` permission.
      x-rateLimit:
        events: 300
        window: 1m
      operationId: listPushes
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/After'
        - $ref: '#/components/parameters/Before'
        - $ref: '#/components/parameters/Sort'
          description: |-
            Push list can be sorted by `id` only.

            To sort in descending order, use `-id`.
            To sort in ascending order, use `id`.

            By default, push list is sorted by `id` in descending order, which corresponds to the newest pushes first.
        - $ref: '#/components/parameters/Filter'
          description: |-
            Filter pushes by:
              - `id`
              - `isMainBranch`
              - `replace`
              - `scoutJobId`

            This field requires a special format.

            For more information, see [Filter results](#section/filter-results).
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
          description: |-
            Search pushes by query string.

            Pushes are searched by:
              - `id`
              - `scoutJobId`
              - `isMainBranch` and `replace`, only when the search term is exactly `true` or `false`
        - name: x-redocly-client
          in: header
          required: false
          description: |
            Identifies the calling client as `<name>/<version>`, for example `reunite-ui/0.92.1`.
            Used for API consumer observability.
            Requests without it are attributed as `unknown`.
          schema:
            type: string
            pattern: ^[a-z0-9-]{1,64}/[\w.+-]{1,32}$
          example: reunite-ui/0.92.1
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushList'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orgs/{orgId}/projects/{projectId}/pushes/{pushId}:
    get:
      security:
        - ApiKey: []
      tags:
        - Pushes
      operationId: getPush
      summary: Retrieve a push
      description: |-
        Retrieve a push.

        Requires `project.remotes.read` permission.
      x-rateLimit:
        events: 2000
        window: 1m
      parameters:
        - $ref: '#/components/parameters/OrgId'
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/PushId'
        - name: x-redocly-client
          in: header
          required: false
          description: |
            Identifies the calling client as `<name>/<version>`, for example `reunite-ui/0.92.1`.
            Used for API consumer observability.
            Requests without it are attributed as `unknown`.
          schema:
            type: string
            pattern: ^[a-z0-9-]{1,64}/[\w.+-]{1,32}$
          example: reunite-ui/0.92.1
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Push'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    Problem:
      type: object
      title: Problem
      properties:
        type:
          type: string
          format: uri-reference
          description: |
            URI reference that uniquely identifies the problem type only in the context of the provided API.
            Opposed to the specification in RFC 9457 (formerly RFC 7807), it is neither recommended to be dereferenceable and point to a human-readable documentation nor globally unique for the problem type.
          default: about:blank
          example: /some/uri-reference
        title:
          type: string
          description: |
            Short summary of the problem type.
            Written in English and readable for engineers, usually not suited for non technical stakeholders and not localized.
          example: some title for the error situation
        status:
          type: integer
          format: int32
          description: |
            HTTP status code generated by the origin server for this occurrence of the problem.
          minimum: 100
          exclusiveMaximum: 600
          example: 400
        detail:
          type: string
          description: |
            Human readable explanation specific to this occurrence of the problem that is helpful to locate the problem and give advice on how to proceed.
            Written in English and readable for engineers, usually not suited for non technical stakeholders and not localized.
          example: some description for the error situation
        instance:
          type: string
          format: uri-reference
          description: |
            URI reference that identifies the specific occurrence of the problem. For example, by adding a fragment identifier or sub-path to the problem type.
            May be used to locate the root of this problem in the source code.
          example: /some/uri-reference#specific-occurrence-context
        object:
          type: string
          enum:
            - problem
        requestId:
          type: string
          description: |
            Unique identifier of the request that produced this problem.
            Share it with support when reporting the error.
          example: req-abc-123
        errors:
          type: array
          description: |
            Additional information about the error situation.
            May be omitted if no additional information is available.
      required:
        - type
        - title
        - status
        - object
    Page:
      type: object
      properties:
        nextPage:
          type:
            - string
            - 'null'
          format: uri-reference
          description: |-
            Path of the next page, relative to the API server URL.
            Append the value to the server URL to get the next page.
            The path keeps the query parameters of the request and sets `after` to the cursor of the next page.
            When `null`, there is no next page.
          example: /orgs/org_123/projects?limit=10&after=a25fgaksjf23la==
        previousPage:
          type:
            - string
            - 'null'
          format: uri-reference
          description: |-
            Path of the previous page, relative to the API server URL.
            Append the value to the server URL to get the previous page.
            The path keeps the query parameters of the request and sets `before` to the cursor of the previous page.
            When `null`, there is no previous page.
          example: /orgs/org_123/projects?limit=10&before=bfg23aksjf23zb1==
        limit:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          description: Value showing how many items are in the page limit.
      required:
        - nextPage
        - previousPage
        - limit
    AuditLogExportJobCreated:
      type: object
      description: Details of the created audit log export job.
      properties:
        id:
          readOnly: true
          type: string
          pattern: ^exp_[0-9abcdefghjkmnpqrstvwxyz]{26}$
          description: Unique identifier for the export job, prefixed with `exp_`.
          example: exp_01hh1t9sa6gwfv5naz04gr7ehm
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Export job creation time (ISO 8601).
      required:
        - id
        - createdAt
    AuditLogExportStatus:
      type: string
      description: Current status of the export job.
      enum:
        - IN_PROGRESS
        - COMPLETED
        - FAILED
    AuditLogExportJob:
      type: object
      description: Audit log export job status and metadata.
      properties:
        id:
          readOnly: true
          type: string
          pattern: ^exp_[0-9abcdefghjkmnpqrstvwxyz]{26}$
          description: Unique identifier for the export job, prefixed with `exp_`.
          example: exp_01hh1t9sa6gwfv5naz04gr7ehm
        status:
          $ref: '#/components/schemas/AuditLogExportStatus'
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Export job creation time (ISO 8601).
      required:
        - id
        - status
        - createdAt
    AuditLogEventType:
      type: string
      description: |-
        CloudEvent `type` value emitted for an audit-loggable action.
        Only events whose `type` is in this list are returned by the audit log export endpoints.
      enum:
        - com.redocly.apiKey.created
        - com.redocly.apiKey.updated
        - com.redocly.apiKey.revoked
        - com.redocly.gitIdentity.linked
        - com.redocly.gitIdentity.unlinked
        - com.redocly.gitIdentity.removed
        - com.redocly.scimCredential.created
        - com.redocly.scimCredential.revoked
        - com.redocly.invite.created
        - com.redocly.invite.resent
        - com.redocly.userInvite.accepted
        - com.redocly.membership.created
        - com.redocly.membership.updated
        - com.redocly.membership.removed
        - com.redocly.team.created
        - com.redocly.team.deleted
        - com.redocly.teamMember.added
        - com.redocly.teamMember.removed
        - com.redocly.syncedTeamMember.added
        - com.redocly.syncedTeamMember.removed
        - com.redocly.teamManager.added
        - com.redocly.teamManager.removed
        - com.redocly.organization.created
        - com.redocly.organization.updated
        - com.redocly.organization.slugUpdated
        - com.redocly.organization.removed
        - com.redocly.project.created
        - com.redocly.project.updated
        - com.redocly.project.slugUpdated
        - com.redocly.project.urlUpdated
        - com.redocly.project.removed
        - com.redocly.projectConfig.updated
        - com.redocly.projectCustomDomain.verified
        - com.redocly.projectCustomDomain.removed
        - com.redocly.branch.created
        - com.redocly.branch.updated
        - com.redocly.branch.removed
        - com.redocly.gitAccess.pushed
        - com.redocly.remote.created
        - com.redocly.remote.deleted
        - com.redocly.gitCredential.rotated
        - com.redocly.notificationSettings.updated
        - com.redocly.notifications.disabled
        - com.redocly.subscription.updated
        - com.redocly.subscription.churned
        - com.redocly.subscription.reactivated
        - com.redocly.subscription.trialEnded
        - com.redocly.pullRequest.created
        - com.redocly.pullRequest.closed
        - com.redocly.pullRequest.reopened
        - com.redocly.pullRequest.merged
        - com.redocly.pullRequest.approved
        - com.redocly.pullRequest.requestedChanges
        - com.redocly.pullRequest.reviewRequested
        - com.redocly.pullRequest.readyForReview
        - com.redocly.pullRequest.markedAsDraft
        - com.redocly.pullRequest.commented
        - com.redocly.pullRequest.commitPushed
        - com.redocly.pullRequest.forcePushed
        - com.redocly.pullRequest.visualReviewUpdated
      example: com.redocly.pullRequest.created
    id:
      description: Project ID. Unique identifier prefixed with `prj_`.
      type: string
      pattern: ^prj_[0-9abcdefghjkmnpqrstvwxyz]{26}$
      example: prj_01hh1t9sa6gwfv5naz04gr7ehm
      readOnly: true
    slug:
      description: Project slug.
      type: string
      example: project_red-owl-352
    AuditLogExportEvent:
      type: object
      description: One audit log export record.
      required:
        - id
        - type
      properties:
        id:
          type: string
          description: Unique event identifier.
          example: evt_2fxb8r4kq7m3ndp9z6ja501
        object:
          type: string
          description: Entity name.
          enum:
            - event
          readOnly: true
        type:
          $ref: '#/components/schemas/AuditLogEventType'
        time:
          type: string
          format: date-time
          description: Event timestamp (ISO 8601).
          example: '2026-04-15T14:43:08.172Z'
        subject:
          type: string
          description: Subject URI or resource ID the event refers to.
          example: pr_7wnk3jm9xp2d4rv8qh5a01
        projectId:
          $ref: '#/components/schemas/id'
        projectSlug:
          $ref: '#/components/schemas/slug'
        clientIp:
          type: string
          description: IP address of the client that triggered the event.
          example: 198.51.100.42
        actor:
          oneOf:
            - type: 'null'
            - type: object
              description: Actor that triggered the event.
              properties:
                id:
                  type: string
                  pattern: ^(usr|gid|wh|cj)_[0-9abcdefghjkmnpqrstvwxyz]{26}$
                  example: usr_01h2r5f6qy8kr42p8yfw52spq6
                object:
                  type: string
                  enum:
                    - user
                    - gitIdentity
                    - webhook
                    - cronJob
                  example: user
                uri:
                  type: string
                  format: uri
                  example: https://app.cloud.redocly.com/api/users/usr_01h2r5f6qy8kr42p8yfw52spq6
              required:
                - id
                - object
                - uri
              additionalProperties: false
      additionalProperties: false
    Feedback:
      type: object
      title: Feedback
      additionalProperties: false
      properties:
        id:
          description: Feedback ID. Unique identifier prefixed with `fb_`.
          type: string
          pattern: ^fb_[0-9abcdefghjkmnpqrstvwxyz]{26}$
          example: fb_01h1s5z6vf2mm1mz3hevnn9va7
          readOnly: true
        object:
          description: Entity name.
          type: string
          enum:
            - feedback
          readOnly: true
        uri:
          description: Canonical URI for the feedback resource.
          type: string
          format: uri
          readOnly: true
          example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/feedback/fb_01h1s5z6vf2mm1mz3hevnn9va7
        email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 254
          description: Email address of user who submitted the feedback or `null`.
        path:
          type: string
          minLength: 1
          maxLength: 1000
          description: Absolute URL of the page where feedback is submitted (for example from the browser location). A value that is not a valid URL is accepted, but the feedback is marked as spam.
          example: https://example.com/docs/guide
        location:
          type:
            - string
            - 'null'
          maxLength: 5000
          description: |-
            Identifies the location of the component.
            This could be a code sample.
        lang:
          type: string
          maxLength: 20
          description: |-
            Identifies the language of the component's location.
            This could be the language of a code sample, such as `js`, `php`, or `txt`.
        feedbackComponent:
          type: string
          description: Name that identifies UI component.
          enum:
            - SENTIMENT
            - RATING
            - COMMENT
            - MOOD
            - PROBLEM
            - SCALE
        score:
          description: Numeric value that maps to the feedback component, such as thumbs down (-1) or thumbs up (1), or a 1-5 star rating scale.
          type:
            - integer
            - 'null'
          minimum: -1
          maximum: 10
        maxScore:
          description: Maximum score for the feedback component.
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 10
        reasons:
          type: array
          description: List of preset reasons for feedback.
          items:
            type: string
            maxLength: 5000
            description: Reason for feedback.
        comment:
          type: string
          maxLength: 5000
          description: Free-form text feedback.
        agent:
          type:
            - string
            - 'null'
          maxLength: 200
          description: Name of the AI agent that submitted the feedback, or `null` for user-submitted feedback.
          example: Cursor
        targetFeature:
          type:
            - string
            - 'null'
          maxLength: 500
          description: Documentation feature the feedback refers to (for agent submissions), or `null` for user-submitted feedback.
          example: Respect Monitoring API
        origin:
          type: string
          description: Origin of the feedback. `FORM` is the feedback form on the page, `API` is a direct API call (for example an agent that follows `llms.txt` instructions), and `MCP` is the MCP server `submit-feedback` tool. When omitted on create, defaults to `API` if `agent` is set and to `FORM` otherwise.
          enum:
            - FORM
            - API
            - MCP
          example: MCP
        metadata:
          type: object
          description: Extra tracking fields. The server sets `userAgent`, `ipAddress`, `platform`, and `email` (read-only). `id`, `firstName`, `lastName`, and `auth_time` pass through if present but are not verified; do not use for access or identity. Any other key is stored with its value redacted to a placeholder.
          properties:
            userAgent:
              type: string
              description: User agent string of the browser that submitted the feedback. Populated by the server from the `User-Agent` header.
              example: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
              readOnly: true
            ipAddress:
              type: string
              description: IP address of the user who submitted the feedback. Populated by the server.
              example: 127.0.0.1
              readOnly: true
            platform:
              type: string
              description: Platform from which the feedback originates. Populated by the server from the `Sec-Ch-Ua-Platform` header.
              example: Windows NT 10.0; Win64; x64
              readOnly: true
            email:
              type: string
              format: email
              description: Email address from the user's authentication context. Populated by the server from OIDC claims.
              example: john.doe@acme.com
              readOnly: true
            id:
              type: string
              description: Unverified; whatever the client sent. Not a trusted user ID.
            firstName:
              type: string
              description: Unverified; client-supplied if present.
            lastName:
              type: string
              description: Unverified; client-supplied if present.
            auth_time:
              oneOf:
                - type: integer
                - type: string
              description: Unverified; client-supplied. Not a server-asserted session or token time.
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        status:
          type: string
          description: Feedback status.
          enum:
            - NEW
            - IN_REVIEW
            - RESOLVED
            - ARCHIVED
            - SPAM
          example: ARCHIVED
          readOnly: true
        organizationId:
          description: Organization ID. Unique identifier prefixed with `org_`.
          type: string
          pattern: ^org_[0-9abcdefghjkmnpqrstvwxyz]{26}$
          example: org_01hh1t9sa6gwfv5naz04gr7ehm
          readOnly: true
        projectId:
          description: Project ID. Unique identifier prefixed with `prj_`.
          type: string
          pattern: ^prj_[0-9abcdefghjkmnpqrstvwxyz]{26}$
          example: prj_01hh1t9sa6gwfv5naz04gr7ehm
          readOnly: true
        internalComment:
          type:
            - string
            - 'null'
          description: Internal comment for the feedback.
          example: This feedback is related to the issue 235.
          readOnly: true
        internalCommentUpdatedAt:
          type: string
          format: date-time
          description: Date and time when the internal comment is updated.
          readOnly: true
        internalCommentUpdatedById:
          type: string
          description: ID of the user who updated the internal comment.
          readOnly: true
      required:
        - id
        - uri
        - path
        - feedbackComponent
        - createdAt
        - object
        - organizationId
        - projectId
        - status
        - origin
    FeedbackList:
      type: object
      properties:
        object:
          type: string
          enum:
            - list
        page:
          $ref: '#/components/schemas/Page'
        data:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/Feedback'
      required:
        - object
        - page
        - data
    PatchFeedbackRequest:
      type: object
      title: Feedback PATCH request
      minProperties: 1
      properties:
        status:
          type: string
          description: Feedback status.
          enum:
            - NEW
            - IN_REVIEW
            - RESOLVED
            - ARCHIVED
            - SPAM
          example: ARCHIVED
          writeOnly: true
        internalComment:
          type:
            - string
            - 'null'
          description: Internal comment for the feedback.
          example: This feedback is related to the issue 235.
          writeOnly: true
    PushProjectBuildStatus:
      type: object
      required:
        - deploy
        - scorecard
      properties:
        deploy:
          type: object
          properties:
            url:
              type:
                - string
                - 'null'
              description: Deployment URL.
            status:
              type: string
              description: Status of project deployment.
              enum:
                - pending
                - running
                - success
                - failed
                - skipped
              example: running
          required:
            - status
            - url
        scorecard:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Scorecard name.
                example: 'Scorecard: Compliance API'
              status:
                type: string
                enum:
                  - pending
                  - running
                  - success
                  - failed
              description:
                type: string
                description: Scorecard status description.
              url:
                type: string
                description: Scorecard URL.
            required:
              - name
              - status
              - description
              - url
    Push:
      type: object
      required:
        - id
        - remoteIds
        - commit
        - uploadedFiles
        - isOutdated
        - hasChanges
        - status
      properties:
        id:
          description: Push ID. Unique identifier prefixed with `push_`.
          type: string
          pattern: ^push_[0-9abcdefghjkmnpqrstvwxyz]{26}$
          example: push_01h2captefvs9bpg3v6twqqj9n
          readOnly: true
        object:
          description: Entity name.
          type: string
          enum:
            - push
          readOnly: true
        remoteIds:
          type: array
          items:
            type: string
            description: Remote IDs. Unique identifier prefixed with `rem_` for pushed remotes.
            pattern: ^rem_[0-9abcdefghjkmnpqrstvwxyz]{26}$
        remoteId:
          type: string
          description: Remote ID. Unique identifier prefixed with `rem_` for pushed remotes. Used only for single remote push.
          pattern: ^rem_[0-9abcdefghjkmnpqrstvwxyz]{26}$
          deprecated: true
        commit:
          type: object
          required:
            - message
            - branchName
            - author
          description: Commit details.
          properties:
            message:
              type: string
              description: Commit message.
              example: 'chore: Add new API'
            branchName:
              type: string
              description: Branch name.
              example: main
            sha:
              type:
                - string
                - 'null'
              description: SHA of the commit.
              example: f64ae8ea9dd7cf28822c471ea56b6d6765971305
            url:
              type:
                - string
                - 'null'
              format: uri
              description: Commit URL.
              example: https://gitlab.com/example-user/example-project/-/commit/f64ae8ea9dd7cf28822c471ea56b6d6765971305
            createdAt:
              type:
                - string
                - 'null'
              format: date-time
              description: Commit creation date.
              example: '2020-01-01T00:00:00.000Z'
            namespaceId:
              type:
                - string
                - 'null'
              description: Git namespace ID (organization login for GitHub).
              example: Redocly
            repositoryId:
              type:
                - string
                - 'null'
              description: Git repository ID.
              example: redoc
            author:
              description: Commit author details.
              type: object
              required:
                - email
                - name
              properties:
                name:
                  description: Commit author name.
                  example: John Doe
                email:
                  type: string
                  description: Commit author email.
                  format: email
                  example: johndoe@example.com
                image:
                  type:
                    - string
                    - 'null'
                  description: |-
                    Commit author image URL.
                    If not provided, the default image is used.
                    If the image is not accessible, [data URL](https://developer.mozilla.org/en-US/docs/Web/HTTP/Basics_of_HTTP/Data_URLs) can be used.
            statuses:
              type: array
              readOnly: true
              description: List of commit statuses set by Reunite to the commit that triggered push.
              items:
                type: object
                properties:
                  name:
                    type: string
                    description: Commit status name.
                    example: 'Scorecard: Compliance API (org-slug/project-slug/remote-mount-path (remote))'
                  status:
                    type: string
                    enum:
                      - pending
                      - running
                      - success
                      - failed
                  description:
                    type: string
                    description: Commit status description.
                  url:
                    type:
                      - string
                      - 'null'
                    description: Commit status URL.
                required:
                  - name
                  - status
                  - description
                  - url
        scoutJobId:
          type:
            - string
            - 'null'
          pattern: ^job_[0-9abcdefghjkmnpqrstvwxyz]{26}$
          description: '`PROCESS_GIT_REPO` job, if any. Required for Scout pushes. Unique identifier prefixed with `job_`.'
          example: job_01h2captefvs9bpg3v6twqqj9n
        scoutJobContext:
          type: string
          writeOnly: true
          description: |-
            Context of the `PROCESS_GIT_REPO` job, if any.
            Applies to Scout pushes only.
            Used as commit status context.
          example: Team A
        replace:
          type: boolean
          description: |-
            Whether to replace the existing files.
            If provided, all files from the remote are removed and the new files are added.
            If not provided, the existing files are kept and the new files are added, overwriting the existing files where they overlap.
          example: true
          default: false
        files:
          type: object
          writeOnly: true
          description: Map of files to upload.
          additionalProperties:
            description: Files to push.
            type: string
            format: binary
        uploadedFiles:
          type: array
          readOnly: true
          description: List of pushed files.
          items:
            type: object
            description: Pushed file.
            required:
              - path
              - mimeType
            properties:
              path:
                type: string
                description: File path.
                example: some-path/index.html
              mimeType:
                type: string
                description: File MIME type.
                example: text/html
        isMainBranch:
          type: boolean
          example: true
          description: Is push provided to the main branch.
        isOutdated:
          type: boolean
          readOnly: true
          description: |-
            Indicates whether the push is discarded.
            In case several pushes are performed in a row, the one with most recent commit is applied only.
            Always `false` when commit's `createdAt` is omitted.
          example: false
        hasChanges:
          type: boolean
          readOnly: true
          description: Indicates if pushed files have changes.
          example: false
        status:
          type: object
          readOnly: true
          description: Status of the corresponding preview and production builds.
          required:
            - preview
            - production
          properties:
            preview:
              $ref: '#/components/schemas/PushProjectBuildStatus'
            production:
              $ref: '#/components/schemas/PushProjectBuildStatus'
    PushList:
      type: object
      properties:
        object:
          type: string
          enum:
            - list
        page:
          $ref: '#/components/schemas/Page'
        data:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/Push'
      required:
        - object
        - page
        - data
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      description: |-
        API key is required to access API.
        Create an API key by visiting [Reunite](https://app.cloud.redocly.com/) and navigating to **Access** > **API Keys** page.
  responses:
    BadRequestError:
      description: Bad Request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalServerError:
      description: Internal Server Error.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnauthorizedError:
      description: User is not authorized to access this resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ForbiddenError:
      description: Forbidden.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFoundError:
      description: Resource not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NoContent:
      description: No Content.
    TooManyRequestsError:
      description: |-
        Too Many Requests.

        The organization exceeded the rate limit for this operation.
        The `Retry-After` header gives the number of seconds to wait before the next request.
      headers:
        Retry-After:
          description: Number of seconds to wait before sending another request.
          schema:
            type: integer
            minimum: 1
          example: 30
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    OrgId:
      name: orgId
      description: Organization ID.
      required: true
      in: path
      schema:
        type: string
        pattern: ^org_[0-9abcdefghjkmnpqrstvwxyz]{26}$
        description: Unique identifier prefixed with `org_`.
      example: org_01h1s5z6vf2mm1mz3hevnn9va7
    After:
      name: after
      in: query
      required: false
      description: |-
        Cursor of the next page.
        `page.nextPage` contains it as the `after` query parameter, so you can also request `page.nextPage` directly.
        The cursor is opaque, and its internal structure is subject to change.
      schema:
        type: string
      example: a25fgaksjf23la==
    Before:
      name: before
      in: query
      required: false
      description: |-
        Cursor of the previous page.
        `page.previousPage` contains it as the `before` query parameter, so you can also request `page.previousPage` directly.
        The cursor is opaque, and its internal structure is subject to change.
      schema:
        type: string
      example: bfg23aksjf23zb1==
    Limit:
      name: limit
      description: |-
        Use to return a number of results per page.
        If there is more data, use in combination with `after` to page through the data.
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      example: 10
    Filter:
      name: filter
      description: |-
        Filters the collection items. This field requires a special format.

        For more information, see [Filter results](#section/filter-results).
      in: query
      required: false
      schema:
        type: string
      example: status:approved createdAt:30d
    Sort:
      name: sort
      description: |-
        To sort by ID in descending order use `-id`.
        To sort by ID in ascending order use `id`.
      in: query
      required: false
      schema:
        type: string
        default: -id
      example: -id
    Search:
      name: search
      in: query
      description: Search.
      required: false
      schema:
        type: string
      example: text-to-search
    ProjectId:
      name: projectId
      description: Project ID.
      required: true
      in: path
      schema:
        type: string
        pattern: ^prj_[0-9abcdefghjkmnpqrstvwxyz]{26}$
        description: Unique identifier prefixed with `prj_`.
      example: prj_01hh1t9sa6gwfv5naz04gr7ehm
    ExportJobId:
      name: exportJobId
      description: Export Job ID.
      required: true
      in: path
      schema:
        type: string
        pattern: ^exp_[0-9abcdefghjkmnpqrstvwxyz]{26}$
        description: Unique identifier prefixed with `exp_`.
      example: exp_01h1s5z6vf2mm1mz3hevnn9va7
    FeedbackId:
      name: feedbackId
      description: Feedback ID.
      required: true
      in: path
      schema:
        type: string
        pattern: ^fb_[0-9abcdefghjkmnpqrstvwxyz]{26}$
        description: Unique identifier prefixed with `fb_`.
      example: fb_01h1s5z6vf2mm1mz3hevnn9va7
    PushId:
      name: pushId
      description: Push ID.
      required: true
      in: path
      schema:
        type: string
        pattern: ^push_[0-9abcdefghjkmnpqrstvwxyz]{26}$
        description: Unique identifier prefixed with `push_`.
      example: push_01hhh91dhc2kg9naf476y7qmas
