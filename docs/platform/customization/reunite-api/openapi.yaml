          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/ProjectSource'
      required:
        - object
        - page
        - data
    MountPath:
      type: string
      description: Path to the folder in the local repository where remote content is mounted. Paths outside of the project's `contentPath` are not allowed.
      example: apis/test/@v1
    AutoSync:
      type: boolean
      default: true
      description: Whether Reunite syncs changes from the remote automatically.
    AutoSyncDisabledAt:
      type:
        - string
        - 'null'
      format: date-time
      readOnly: true
      description: |-
        Time when Reunite turned off auto-sync after repeated failed updates.
        `null` when auto-sync is on or a user turned it off.
      example: '2021-08-25T10:00:00.000Z'
    AutoMerge:
      type: boolean
      default: false
      description: Auto merge changes from remote.
    MountBranchName:
      type: string
      description: Name of the branch to mount.
      example: main
    GenericRemoteError:
      oneOf:
        - type: 'null'
        - type: object
          properties:
            autoMerge:
              type: object
              properties:
                message:
                  type: string
                  description: Error message describing the auto merge failure.
                timestamp:
                  type: string
                  format: date-time
                  description: Timestamp of the error.
                buildId:
                  type: string
                  description: ID of the build that triggered the auto merge.
              required:
                - message
                - timestamp
          required:
            - autoMerge
      readOnly: true
    LastSyncedAt:
      type:
        - string
        - 'null'
      format: date-time
      description: |-
        Last time remote processed the default branch update.
        `null` when the remote has never been synced.
        For URL remotes it is updated on interval specified for the remote.
      example: '2021-08-25T10:00:00.000Z'
    SyncAttempts:
      type: integer
      description: Number of failed attempts to sync the remote. If this value exceeds **6**, automatic synchronization is disabled.
      example: 1
    UrlRemote:
