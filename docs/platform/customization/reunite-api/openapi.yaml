    slug:
      description: Project slug.
      type: string
      example: project_red-owl-352
    AuditLogExportEvent:
      type: object
      description: One audit log export record.
      required:
        - id
        - type
      properties:
        id:
          type: string
          description: Unique event identifier.
          example: evt_2fxb8r4kq7m3ndp9z6ja501
        object:
          type: string
          description: Entity name.
          enum:
            - event
          readOnly: true
        type:
          $ref: '#/components/schemas/AuditLogEventType'
        time:
          type: string
          format: date-time
          description: Event timestamp (ISO 8601).
          example: '2026-04-15T14:43:08.172Z'
        subject:
          type: string
          description: Subject URI or resource ID the event refers to.
          example: pr_7wnk3jm9xp2d4rv8qh5a01
        projectId:
          $ref: '#/components/schemas/id'
        projectSlug:
          $ref: '#/components/schemas/slug'
        clientIp:
          type: string
          description: IP address of the client that triggered the event.
          example: 198.51.100.42
        actor:
          oneOf:
            - type: 'null'
            - type: object
              description: Actor that triggered the event.
              properties:
                id:
                  type: string
                  pattern: ^(usr|gid|wh|cj)_[0-9abcdefghjkmnpqrstvwxyz]{26}$
                  example: usr_01h2r5f6qy8kr42p8yfw52spq6
                object:
                  type: string
                  enum:
                    - user
                    - gitIdentity
                    - webhook
                    - cronJob
                  example: user
                uri:
                  type: string
                  format: uri
                  example: https://app.cloud.redocly.com/api/users/usr_01h2r5f6qy8kr42p8yfw52spq6
              required:
                - id
                - object
                - uri
              additionalProperties: false
      additionalProperties: false
    CredentialType:
      type: string
      format: enum
      description: Credential type.
      enum:
        - GITHUB_USER
        - GITLAB_USER
        - BITBUCKET_USER
        - AZURE_USER
        - URL
        - GITHUB_CLOUD_APP_INSTALLATION
        - GITHUB_SERVER_APP_INSTALLATION
        - GITHUB_SERVER_APP
        - GITLAB_SELF_MANAGED_APP
        - GITHUB_CLOUD_INTERNAL_APP_INSTALLATION
        - MCP_HEADERS
        - MCP_BEARER
        - MCP_API_KEY
        - SUPPORT_DESK
    AuthType:
      type: string
      format: enum
