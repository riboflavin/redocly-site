          type: number
        namespaceId:
          type: string
        repositoryId:
          type: string
      required:
        - namespaceId
        - repositoryId
    GitHubEEServerAppPublicCredential:
      title: GitHubEEServerAppPublicCredential
      type: object
      properties:
        appId:
          type: string
        clientId:
          type: string
        url:
          type: string
        apiUrl:
          type: string
        appName:
          type: string
      required:
        - appId
        - clientId
        - url
    GitLabSelfManagedAppPublicCredential:
      title: GitLabSelfManagedAppPublicCredential
      type: object
      properties:
        appId:
          type: string
        url:
          type: string
      required:
        - appId
        - url
    AzureDevOpsUserPATPublicCredential:
      title: AzureDevOpsUserPATPublicCredential
      type: object
      properties:
        organizationName:
          type: string
      required:
        - organizationName
    BitbucketCloudUserProjectTokenPublicCredential:
      title: BitbucketCloudUserProjectTokenPublicCredential
      type: object
      properties:
