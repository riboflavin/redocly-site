      required:
        - workspace
    McpPublicCredential:
      title: McpPublicCredential
      type: object
      description: 'Non-secret part of the credential of an agent MCP server: the header that carries the API key, and the names of the secret headers besides the authentication header. Values live in the secret store.'
      properties:
        header:
          description: Request header that carries the API key; absent for a bearer token.
          type: string
          example: X-Api-Key
        secretHeaderNames:
          description: Names of the secret headers besides the authentication header.
          type: array
          items:
            type: string
          example:
            - X-Tenant
      required:
        - secretHeaderNames
    CredentialSchemaBase:
      title: CredentialsSchemaBase
      type: object
      properties:
        id:
          description: Credential ID. Unique identifier prefixed with `cred_`.
          type: string
          pattern: ^cred_[0-9abcdefghjkmnpqrstvwxyz]{26}$
          example: cred_01h1s5z6vf2mm1mz3hevnn9va7
          readOnly: true
        object:
          description: Entity name.
          type: string
          enum:
            - credential
          readOnly: true
        uri:
          description: Canonical URI for the credential resource.
          type: string
          format: uri
          readOnly: true
          example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/credentials/cred_01h1s5z6vf2mm1mz3hevnn9va7
        type:
          $ref: '#/components/schemas/CredentialType'
        authType:
          $ref: '#/components/schemas/AuthType'
        name:
          type: string
        description:
          type: string
        publicData:
          type: object
          description: Credential public data.
          oneOf:
            - $ref: '#/components/schemas/GitHubInstallationPublicCredential'
            - $ref: '#/components/schemas/GitHubEEServerAppPublicCredential'
            - $ref: '#/components/schemas/GitLabSelfManagedAppPublicCredential'
            - $ref: '#/components/schemas/AzureDevOpsUserPATPublicCredential'
            - $ref: '#/components/schemas/BitbucketCloudUserProjectTokenPublicCredential'
            - $ref: '#/components/schemas/McpPublicCredential'
        oAuth2Data:
          type: object
          description: Credential OAuth2 data.
          readOnly: true
          properties:
            id:
              oneOf:
                - type: string
                - type: number
              description: OAuth2 ID. Unique identifier of OAuth2 account.
              example: 4acc1f09-1751-6f79-b156-b6877ee205a2
            userName:
              type: string
              description: OAuth2 user name.
              example: john-doe
            displayName:
              type: string
              description: OAuth2 display name.
              example: John Doe
            email:
              type: string
              description: OAuth2 email.
              example: john-doe@mail.com
            avatarUrl:
              type: string
              description: OAuth2 avatar URL.
              example: https://avatars.githubusercontent.com/u/1?v=4
          required:
            - id
            - userName
            - displayName
        userId:
          description: User ID this credentials belongs to. Unique identifier prefixed with `usr_`.
          type: string
          pattern: ^usr_[0-9abcdefghjkmnpqrstvwxyz]{26}$
          example: usr_01hh1t9sa6gwfv5naz04gr7ehm
          readOnly: true
        isShared:
          type: boolean
          default: false
        isBroken:
          type: boolean
          default: false
          readOnly: true
        parentId:
          type: string
          pattern: ^cred_[0-9abcdefghjkmnpqrstvwxyz]{26}$
          description: Credential parent ID. Unique identifier prefixed with `cred_`.
          example: cred_01h4e71x94vd68a1farnbfapzg
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
        - id
        - object
        - uri
        - type
        - createdAt
        - updatedAt
    AccessTokenCredential:
      title: AccessTokenCredential
      type: object
      writeOnly: true
      properties:
        accessToken:
          type: string
      required:
        - accessToken
    OAuth2CodeCredential:
      title: OAuth2CodeCredential
      type: object
      writeOnly: true
      properties:
        code:
          description: OAuth code to be used to get access/refresh tokens.
          type: string
          example: Yzk5ZDczMzRlNDEwY
      required:
        - code
    GithubAppCodeCredential:
      title: GithubAppCodeCredential
      type: object
      writeOnly: true
      properties:
        code:
          description: GithubApp code to be used to get exchange code on App secrets.
          type: string
          example: Yzk5ZDczMzRlNDEwY
        url:
          description: GithubApp url to be used to get exchange code on App secrets.
          type: string
          example: https://github.app.com
      required:
        - code
        - url
    GitLabSelfManagedAppSecretCredential:
      title: GitLabSelfManagedAppSecretCredential
      type: object
      writeOnly: true
      properties:
        appSecret:
          type: string
        webhookSecret:
          type: string
      required:
        - appSecret
    GitHubEEServerAppSecretCredential:
      title: GitHubEEServerAppSecretCredential
      type: object
      writeOnly: true
      properties:
        clientSecret:
          type: string
        privateKey:
          type: string
        webhookSecret:
          type: string
    CredentialSchema:
      title: Credential
      type: object
      allOf:
        - $ref: '#/components/schemas/CredentialSchemaBase'
        - type: object
          properties:
            secretData:
              type: object
              description: Credential secret data.
              writeOnly: true
              oneOf:
                - $ref: '#/components/schemas/AccessTokenCredential'
                - $ref: '#/components/schemas/OAuth2CodeCredential'
                - $ref: '#/components/schemas/GithubAppCodeCredential'
                - $ref: '#/components/schemas/GitLabSelfManagedAppSecretCredential'
                - $ref: '#/components/schemas/GitHubEEServerAppSecretCredential'
    CredentialPatchResponse:
      title: CredentialPatchResponse
      type: object
      allOf:
        - $ref: '#/components/schemas/CredentialSchema'
        - type: object
          properties:
            warnings:
              type: array
              description: |
                Problems that do not block the update.
                For example, Reunite cannot set up a webhook for a repository that uses this credential.
              readOnly: true
              items:
                type: string
                example: 'Failed to set up webhook for repository "fe5d7747-af71-449a-951b-f781f54603af": Azure DevOps token does not have sufficient permissions. Please check token scopes.'
          required:
            - warnings
    CreateCredentialRotationRequest:
      title: CreateCredentialRotationRequest
      type: object
      properties:
        credentialId:
          description: ID of the credential whose access token is replaced. Unique identifier prefixed with `cred_`.
          type: string
          pattern: ^cred_[0-9abcdefghjkmnpqrstvwxyz]{26}$
          example: cred_01h1s5z6vf2mm1mz3hevnn9va7
        secretData:
          description: New access token for the credential.
          $ref: '#/components/schemas/AccessTokenCredential'
      required:
        - credentialId
        - secretData
    Feedback:
      type: object
      title: Feedback
      additionalProperties: false
      properties:
        id:
          description: Feedback ID. Unique identifier prefixed with `fb_`.
          type: string
          pattern: ^fb_[0-9abcdefghjkmnpqrstvwxyz]{26}$
          example: fb_01h1s5z6vf2mm1mz3hevnn9va7
          readOnly: true
        object:
          description: Entity name.
          type: string
          enum:
            - feedback
          readOnly: true
        uri:
          description: Canonical URI for the feedback resource.
          type: string
          format: uri
          readOnly: true
          example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/feedback/fb_01h1s5z6vf2mm1mz3hevnn9va7
        email:
          type:
            - string
            - 'null'
          format: email
          maxLength: 254
          description: Email address of user who submitted the feedback or `null`.
        path:
          type: string
          minLength: 1
          maxLength: 1000
          description: Absolute URL of the page where feedback is submitted (for example from the browser location). A value that is not a valid URL is accepted, but the feedback is marked as spam.
          example: https://example.com/docs/guide
        location:
          type:
            - string
            - 'null'
          maxLength: 5000
          description: |-
            Identifies the location of the component.
            This could be a code sample.
        lang:
          type: string
          maxLength: 20
          description: |-
            Identifies the language of the component's location.
            This could be the language of a code sample, such as `js`, `php`, or `txt`.
        feedbackComponent:
          type: string
          description: Name that identifies UI component.
          enum:
            - SENTIMENT
            - RATING
            - COMMENT
            - MOOD
            - PROBLEM
            - SCALE
        score:
          description: Numeric value that maps to the feedback component, such as thumbs down (-1) or thumbs up (1), or a 1-5 star rating scale.
          type:
            - integer
            - 'null'
          minimum: -1
          maximum: 10
        maxScore:
          description: Maximum score for the feedback component.
          type:
            - integer
            - 'null'
          minimum: 0
          maximum: 10
        reasons:
          type: array
          description: List of preset reasons for feedback.
          items:
            type: string
            maxLength: 5000
            description: Reason for feedback.
        comment:
          type: string
          maxLength: 5000
          description: Free-form text feedback.
        agent:
          type:
            - string
            - 'null'
          maxLength: 200
          description: Name of the AI agent that submitted the feedback, or `null` for user-submitted feedback.
          example: Cursor
        targetFeature:
          type:
            - string
            - 'null'
          maxLength: 500
          description: Documentation feature the feedback refers to (for agent submissions), or `null` for user-submitted feedback.
          example: Respect Monitoring API
        origin:
          type: string
          description: Origin of the feedback. `FORM` is the feedback form on the page, `API` is a direct API call (for example an agent that follows `llms.txt` instructions), and `MCP` is the MCP server `submit-feedback` tool. When omitted on create, defaults to `API` if `agent` is set and to `FORM` otherwise.
          enum:
            - FORM
            - API
            - MCP
          example: MCP
        metadata:
          type: object
          description: Extra tracking fields. The server sets `userAgent`, `ipAddress`, `platform`, and `email` (read-only). `id`, `firstName`, `lastName`, and `auth_time` pass through if present but are not verified; do not use for access or identity. Any other key is stored with its value redacted to a placeholder.
          properties:
            userAgent:
              type: string
              description: User agent string of the browser that submitted the feedback. Populated by the server from the `User-Agent` header.
              example: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36
              readOnly: true
            ipAddress:
              type: string
              description: IP address of the user who submitted the feedback. Populated by the server.
              example: 127.0.0.1
              readOnly: true
            platform:
              type: string
              description: Platform from which the feedback originates. Populated by the server from the `Sec-Ch-Ua-Platform` header.
              example: Windows NT 10.0; Win64; x64
              readOnly: true
            email:
              type: string
              format: email
              description: Email address from the user's authentication context. Populated by the server from OIDC claims.
              example: john.doe@acme.com
              readOnly: true
            id:
              type: string
              description: Unverified; whatever the client sent. Not a trusted user ID.
            firstName:
              type: string
              description: Unverified; client-supplied if present.
            lastName:
              type: string
              description: Unverified; client-supplied if present.
            auth_time:
              oneOf:
                - type: integer
                - type: string
              description: Unverified; client-supplied. Not a server-asserted session or token time.
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        status:
          type: string
          description: Feedback status.
          enum:
            - NEW
            - IN_REVIEW
            - RESOLVED
            - ARCHIVED
            - SPAM
          example: ARCHIVED
          readOnly: true
        organizationId:
          description: Organization ID. Unique identifier prefixed with `org_`.
          type: string
          pattern: ^org_[0-9abcdefghjkmnpqrstvwxyz]{26}$
          example: org_01hh1t9sa6gwfv5naz04gr7ehm
          readOnly: true
        projectId:
          description: Project ID. Unique identifier prefixed with `prj_`.
          type: string
          pattern: ^prj_[0-9abcdefghjkmnpqrstvwxyz]{26}$
          example: prj_01hh1t9sa6gwfv5naz04gr7ehm
          readOnly: true
        internalComment:
          type:
            - string
            - 'null'
          description: Internal comment for the feedback.
          example: This feedback is related to the issue 235.
          readOnly: true
        internalCommentUpdatedAt:
          type: string
          format: date-time
          description: Date and time when the internal comment is updated.
          readOnly: true
        internalCommentUpdatedById:
          type: string
          description: ID of the user who updated the internal comment.
          readOnly: true
      required:
        - id
        - uri
        - path
        - feedbackComponent
        - createdAt
        - object
        - organizationId
        - projectId
        - status
        - origin
    FeedbackList:
      type: object
      properties:
        object:
          type: string
          enum:
            - list
        page:
          $ref: '#/components/schemas/Page'
        data:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/Feedback'
      required:
        - object
        - page
        - data
    PatchFeedbackRequest:
      type: object
      title: Feedback PATCH request
      minProperties: 1
      properties:
        status:
          type: string
          description: Feedback status.
          enum:
            - NEW
            - IN_REVIEW
            - RESOLVED
            - ARCHIVED
            - SPAM
          example: ARCHIVED
          writeOnly: true
        internalComment:
          type:
            - string
            - 'null'
          description: Internal comment for the feedback.
          example: This feedback is related to the issue 235.
          writeOnly: true
    GitProviderType:
      type: string
      format: enum
      description: Git provider type.
      enum:
        - GITHUB_CLOUD
        - GITHUB_SERVER
        - GITLAB_CLOUD
        - GITLAB_SELF_MANAGED
        - BITBUCKET_CLOUD
        - BITBUCKET_DATACENTER
        - AZURE_DEVOPS_SERVICES
        - AZURE_DEVOPS_SERVER
    GitProvider:
      type: object
      description: Git provider configuration.
      properties:
        id:
          type: string
        type:
          $ref: '#/components/schemas/GitProviderType'
        name:
          type: string
          example: Redocly GitLab
        publicConfig:
          type: object
          properties:
            url:
              type: string
              example: https://gitlab.redocly.dev
            clientId:
              type: string
              example: 05489443ec38b38f2327cdde9d5f51f284ae1d726130b300ecda0a259010c759
            appName:
              type: string
              example: redocly
        isCustom:
          type: boolean
          description: Indicates whether this provider is a custom provider added to the organization.
      required:
        - id
        - type
        - name
        - isCustom
    ProjectSource:
      type: object
      properties:
        id:
          type: string
          pattern: ^rem_[0-9abcdefghjkmnpqrstvwxyz]{26}$
          example: rem_01hc2rvwxf7jyj1er504khx8e7
          description: Project source ID. Unique identifier prefixed with `rem_`.
          readOnly: true
        uri:
          description: Canonical URI for the project source resource.
          type: string
          format: uri
          readOnly: true
          example: https://app.cloud.redocly.com/api/orgs/org_01hh1t9sa6gwfv5naz04gr7ehm/projects/prj_01hh1t9sa6gwfv5naz04gr7ehm/sources/rem_01hc2rvwxf7jyj1er504khx8e7
        branchName:
          description: Main branch of the project.
          type: string
          example: main
        contentPath:
          description: Path to the project content in the repository.
          type: string
          example: /
        repoName:
          description: Name of the repository. Present when Reunite can access the repository.
          type: string
          example: Repo Name
        repoUrl:
          description: URL of the repository. Present when Reunite can access the repository.
          type: string
          example: https://github.com/example/example
        isInternal:
          description: Whether the project content is stored in the Reunite-hosted repository instead of an external Git repository. Internal sources have no Git provider fields and no credential.
          type: boolean
          example: true
        isMonorepo:
          description: Whether the project content is in a folder of the repository rather than at its root.
          type: boolean
          example: true
        providerType:
          $ref: '#/components/schemas/GitProviderType'
        providerConfig:
          $ref: '#/components/schemas/GitProvider'
          description: Git provider of the repository.
        canAccessRepo:
          type: boolean
          example: true
          description: Whether Reunite can access the repository with the source credential. `false` usually means that the access token is expired or revoked.
        credentialId:
          type: string
          pattern: ^cred_[0-9abcdefghjkmnpqrstvwxyz]{26}$
          example: cred_01hc2rvwxf7jyj1er504khx8e7
          description: |-
            ID of the credential Reunite uses to access the repository.
            Use it to rotate the access token of the credential.
            Absent for internal sources.
        sourceId:
          type: string
          example: rem_01hc2rvwxf7jyj1er504khx8e7
          description: Use `id` instead.
          deprecated: true
        namespaceId:
          type:
            - string
            - 'null'
          description: Git provider namespace of the repository, such as a GitHub organization or an Azure DevOps project.
          example: azure-test-org
        repositoryId:
          type: string
          description: Git provider identifier of the repository.
          example: redocly-testing
        branchDeployStrategy:
          type: string
          description: Which branches other than the main branch start builds.
          enum:
            - NONE
            - SELECTED
            - ALL
        selectedDeployBranches:
          type: array
          description: Branches that start a build when they're updated or a pull request targets them.
          items:
            type: string
        prDeploysEnabled:
          type: boolean
          description: |-
            Whether pull requests start builds when they target the main branch or, with the `SELECTED` strategy, a branch in `selectedDeployBranches`.
            Has no effect with the `ALL` strategy, which builds every branch.
        forksPrDeploysEnabled:
          type: boolean
          description: Whether build starts for PRs from forks.
        visualReviewCheckDisabled:
          type: boolean
          default: false
          description: Whether the Visual review check is disabled. A disabled check is reported as skipped instead of pending.
        createdAt:
          description: Time when Reunite created the project source.
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          description: Time of the last change to the project source.
          type: string
          format: date-time
          readOnly: true
        object:
          description: Entity name.
          type: string
          enum:
            - projectSource
          readOnly: true
      required:
        - id
        - uri
        - branchName
        - contentPath
        - isInternal
        - isMonorepo
        - branchDeployStrategy
        - selectedDeployBranches
        - prDeploysEnabled
        - forksPrDeploysEnabled
        - visualReviewCheckDisabled
        - createdAt
        - updatedAt
