      enum:
        - BASIC
        - PERSONAL_ACCESS_TOKEN
        - PERSONAL_ACCESS_TOKEN_FOR_ORGANIZATION
        - PROJECT_ACCESS_TOKEN
        - INSTALLATION_ACCESS_TOKEN
        - OAUTH2
        - BEARER
        - API_KEY
    GitHubInstallationPublicCredential:
      title: GitHubInstallationPublicCredential
